name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Static checks
        env:
          PYTHONPATH: src
        run: python tools/static_check.py
      - name: Test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel and smoke CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          basaltkv --version
          tmp="$(mktemp -d)"
          basaltkv init "$tmp/db"
          basaltkv put "$tmp/db" hello world
          test "$(basaltkv get "$tmp/db" hello --output text)" = "world"
          basaltkv verify "$tmp/db"

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify evidence manifest
        run: python tools/verify_manifest.py

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run quick benchmark harness
        env:
          PYTHONPATH: src
        run: python benchmarks/bench.py --quick
